name: Verify Last Light prototype
on:
  push:
  pull_request:
jobs:
  static-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check js/data.js
          node --check js/renderer.js
          node --check js/game.js
      - name: Data registry
        run: node tests/data.test.js
      - name: SoT30 integrity
        run: python tools/verify_sot30.py
